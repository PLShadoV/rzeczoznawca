name: Deploy to Cloudflare Pages

# Każdy push: testy, a potem publikacja katalogu dist/ na Cloudflare Pages.
#  - gałąź main  -> wdrożenie produkcyjne,
#  - inne gałęzie -> wdrożenie podglądowe (osobny adres *.pages.dev).
# Wymagane w GitHub: Settings -> Secrets and variables -> Actions
#  - secret  CLOUDFLARE_API_TOKEN   (uprawnienie: Account / Cloudflare Pages / Edit)
#  - secret  CLOUDFLARE_ACCOUNT_ID
#  - variable CLOUDFLARE_PROJECT_NAME (nazwa projektu Pages; domyślnie "rzeczoznawca")
# Bez sekretów krok publikacji jest pomijany, a testy nadal się wykonują.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate application and question references
        run: npm test
      - name: Check Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak sekretów CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — publikacja na Cloudflare pominięta."
          fi
      - name: Create Cloudflare Pages project if missing
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'rzeczoznawca' }}
        run: |
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "Projekt $PROJECT istnieje."
          else
            echo "Tworzę projekt Cloudflare Pages: $PROJECT"
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
      - name: Deploy dist/ to Cloudflare Pages
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'rzeczoznawca' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Cloudflare API bywa chwilowo niedostępne (503) — do 4 prób.
          for i in 1 2 3 4; do
            npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true && exit 0
            echo "Próba $i nieudana, ponawiam za $((i*15)) s..."
            sleep $((i*15))
          done
          exit 1
